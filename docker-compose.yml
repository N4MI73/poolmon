# PoolMon Docker Compose
#
# USAGE (Portainer Repository build method):
#   1. Edit the volume path under services.poolmon.volumes to match your NAS
#   2. In Portainer: Stacks > Add stack > Repository build method
#      Repository URL:   https://github.com/N4MI73/poolmon
#      Reference:         refs/heads/main
#      Compose path:       docker-compose.yml
#   3. Deploy the stack - Portainer clones the repo and builds the image
#      from the Dockerfile automatically (see "build:" below - this is
#      what makes that possible, rather than trying to pull a pre-made
#      image that doesn't exist anywhere).
#
# LOCAL/MANUAL USE (optional, not needed for Portainer):
#   docker compose up -d --build

services:
  poolmon:
    build:
      context: .              # build using the Dockerfile in this repo's root
      dockerfile: Dockerfile
    image: poolmon:latest      # name to give the resulting local image, once built
    container_name: poolmon
    restart: unless-stopped
    ports:
      - "8078:8078"              # access at http://<nas-ip>:8078
    volumes:
      # EDIT THIS PATH to wherever you want data stored on your NAS.
      # This folder will contain:
      #   poolmon.db     - the SQLite database (back this up!)
      #   photos/        - pool photos organized by season/date
      - /volume1/docker/poolmon/data:/data
    environment:
      - POOLMON_DATA_DIR=/data
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8078/api/dashboard')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# No networks or external services needed - this is a self-contained
# single-container app. SQLite lives in the volume alongside photos.
