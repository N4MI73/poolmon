# PoolMon Docker Compose
#
# USAGE:
#   1. Edit the volume path under services.poolmon.volumes to match your NAS
#   2. Deploy via Portainer: Stacks > Add stack > paste this file
#      OR from command line: docker compose up -d
#
# PORTAINER SETUP:
#   - In Portainer, go to Stacks > Add Stack
#   - Name it "poolmon"
#   - Paste this file into the Web editor
#   - Edit POOLMON_DATA_PATH to your NAS path
#   - Click Deploy the stack

services:
  poolmon:
    image: poolmon:latest        # built from the Dockerfile in this repo
    # OR pull from a registry if you push it there:
    # image: ghcr.io/n4mi73/poolmon:latest
    container_name: poolmon
    restart: unless-stopped
    ports:
      - "8078:8078"              # access at http://<nas-ip>:8078
    volumes:
      # EDIT THIS PATH to wherever you want data stored on your NAS.
      # This folder will contain:
      #   poolmon.db     - the SQLite database (back this up!)
      #   photos/        - pool photos organized by season/date
      - /volume1/docker/poolmon/data:/data
    environment:
      - POOLMON_DATA_DIR=/data
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8078/api/dashboard')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# No networks or external services needed - this is a self-contained
# single-container app. SQLite lives in the volume alongside photos.
